version: '3.8'

services:
  # Base de données SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reclamations-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Reclamations2024!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - reclamations-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Reclamations2024! -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reclamations-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=reclamations_db;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=reclamations_user
      - SPRING_DATASOURCE_PASSWORD=Reclamations2024!
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - reclamations-network
    restart: unless-stopped

  # Frontend Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reclamations-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - reclamations-network
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local

networks:
  reclamations-network:
    driver: bridge
